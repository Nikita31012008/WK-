<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Styles</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 VK Styles</h1>
        </div>

        <div class="settings">
            <!-- Theme Selection -->
            <div class="theme-selector">
                <label class="radio-option">
                    <input type="radio" name="theme" value="default" checked>
                    <span>По умолчанию</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="theme" value="dark">
                    <span>🌙 Тёмная</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="theme" value="light">
                    <span>☀️ Лёгкая</span>
                </label>
            </div>

            <!-- Color Scheme -->
            <div class="color-quick-select">
                <p class="label">Цвет:</p>
                <div class="color-buttons">
                    <button class="color-btn active" data-color="default" style="background: #4a90e2;" title="Синяя"></button>
                    <button class="color-btn" data-color="purple" style="background: #9b59b6;" title="Фиолетовая"></button>
                    <button class="color-btn" data-color="green" style="background: #27ae60;" title="Зелёная"></button>
                    <button class="color-btn" data-color="red" style="background: #e74c3c;" title="Красная"></button>
                    <button class="color-btn" data-color="orange" style="background: #f39c12;" title="Оранжевая"></button>
                    <button class="color-btn" data-color="pink" style="background: #e91e63;" title="Розовая"></button>
                </div>
            </div>

            <!-- Toggle Options -->
            <div class="toggle-options">
                <label class="toggle-item">
                    <span>📦 Компактный</span>
                    <input type="checkbox" id="compactMode">
                    <span class="toggle-slider"></span>
                </label>
                <label class="toggle-item">
                    <span>🚫 Без объявлений</span>
                    <input type="checkbox" id="hideAds">
                    <span class="toggle-slider"></span>
                </label>
                <label class="toggle-item">
                    <span>👥 Без рекомендаций</span>
                    <input type="checkbox" id="hideRecommendations">
                    <span class="toggle-slider"></span>
                </label>
                <label class="toggle-item">
                    <span>📖 Без историй</span>
                    <input type="checkbox" id="hideStories">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <div class="footer">
            <button id="resetBtn" class="btn btn-small">↻ Сброс</button>
            <a href="options.html" target="_blank" class="btn btn-primary">⚙️ Все настройки</a>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
